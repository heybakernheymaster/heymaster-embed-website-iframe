<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HeyMaster 課程分類</title><style>
*{box-sizing:border-box}body{margin:0;color:#342d29;font-family:system-ui,'Noto Sans TC',sans-serif;background:transparent}main{max-width:1060px;margin:auto;padding:22px 16px;text-align:center}h2{font-size:25px;margin:0 0 6px;font-weight:650;letter-spacing:.06em}header p{font-size:13px;color:#766b64;margin:0}.stage{position:relative;margin:22px auto 0;padding:0 34px}.viewport{overflow:hidden;padding:12px 0 16px;touch-action:pan-y;outline-offset:4px}.shelf{display:flex;align-items:flex-end;gap:5px;width:max-content;margin:auto;transform:translateX(var(--shift,0px));transition:transform .85s cubic-bezier(.22,1,.36,1)}.book{position:relative;flex:none;width:var(--w);height:var(--h);transition:width .85s cubic-bezier(.22,1,.36,1);perspective:950px;isolation:isolate}.book.active{width:var(--open)}.spine,.cover{position:absolute;inset:0;border:0;border-radius:3px 5px 5px 3px;background:var(--c);color:#342d29;cursor:pointer;transition:transform .85s cubic-bezier(.22,1,.36,1),opacity .65s;transform-origin:left center;backface-visibility:hidden;box-shadow:2px 4px 7px #392c2218,inset 3px 0 #ffffff50,inset -3px 0 #0000000c}.spine{width:100%;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-size:13px;font-weight:650;letter-spacing:.10em;padding:7px 0;white-space:nowrap}.cover{width:var(--open);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:15px 12px 13px;opacity:0;transform:rotateY(-88deg);pointer-events:none;overflow:hidden;text-align:center;text-decoration:none}.active .spine{opacity:0;transform:rotateY(89deg);pointer-events:none}.active .cover{opacity:1;transform:rotateY(0);pointer-events:auto}.cover:before{content:'';position:absolute;left:6px;top:0;bottom:0;border-left:1px solid #ffffff55}.cover small{font-size:9px;letter-spacing:.13em}.cover strong{font-size:clamp(17px,2vw,22px);line-height:1.3;letter-spacing:.03em}.cover svg,.cover img{width:86%;height:43%;object-fit:contain}.cover .en{font-size:10px;letter-spacing:.06em}.cta{font-size:11px;font-weight:600;border-bottom:1px solid currentColor;padding-bottom:3px}.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#79584c;width:32px;height:44px;cursor:pointer;padding:0}.arrow svg{width:18px;height:18px}.prev{left:0}.next{right:0}.arrow:disabled{opacity:.18;cursor:default}.hint{font-size:12px;color:#82746b;margin:5px 0 0}.book button:focus-visible,.cover:focus-visible,.arrow:focus-visible{outline:2px solid #79584c;outline-offset:2px}.shelf.dragging{transition:none}@media(max-width:700px){main{padding:16px 0}h2{font-size:21px}.stage{padding:0 27px;margin-top:12px}.arrow{width:25px}.shelf{gap:4px;margin:0}.book{height:calc(var(--h)*.87);width:max(32px,var(--w))}.book.active{width:var(--open)}.spine{font-size:11px}.cover{padding:12px 8px}.cover strong{font-size:17px}.hint{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style></head><body><main><header><h2>課程分類</h2><p>翻開你的手作日常，找到下一堂想學的課</p></header><div class="stage"><button class="arrow prev" aria-label="上一個分類"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m15 4-8 8 8 8"/></svg></button><div class="viewport" tabindex="0" aria-label="課程分類書架"><div class="shelf"></div></div><button class="arrow next" aria-label="下一個分類"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m9 4 8 8-8 8"/></svg></button></div><p class="hint" aria-live="polite"></p></main><script src="categories.js"></script><script>
const shelf=document.querySelector('.shelf'),vp=document.querySelector('.viewport'),prev=document.querySelector('.prev'),next=document.querySelector('.next');let current=Math.min(2,CATEGORIES.length-1);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function safe(s){try{let u=new URL(s,location.href);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}}const books=CATEGORIES.map((b,i)=>{let el=document.createElement('article');el.className='book';el.style.setProperty('--c',b.color);el.style.setProperty('--h',(b.height||250)+'px');el.style.setProperty('--w',(b.thickness||40)+'px');let url=b.url?safe(b.url):'';let art=b.image?`<img src="${esc(b.image)}" alt="">`:`<svg viewBox="0 0 140 110" aria-hidden="true"><g fill="${esc(b.ink||'#fff5dc')}" fill-opacity=".55" stroke="#674d3b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${ART[b.art]||ART.cake}</g></svg>`;el.innerHTML=`<button class="spine" type="button">${esc(b.name)}</button><a class="cover" ${url?`href="${esc(url)}" target="_top"`:'aria-disabled="true"'}><small>HEYMASTER · ${String(i+1).padStart(2,'0')}</small><strong>${esc(b.name)}</strong>${art}<span class="en">${esc(b.en)}</span><span class="cta">探索課程 ↗</span></a>`;el.querySelector('button').onclick=()=>select(i);shelf.append(el);return el});function position(){let mobile=matchMedia('(max-width:700px)').matches;let open=mobile?Math.max(130,Math.min(250,vp.clientWidth-88)):230;shelf.style.setProperty('--open',open+'px');let gap=mobile?4:5;let widths=CATEGORIES.map((b,i)=>i===current?open:mobile?Math.max(32,b.thickness||40):b.thickness||40);let total=widths.reduce((a,b)=>a+b,0)+gap*(widths.length-1);let center=widths.slice(0,current).reduce((a,b)=>a+b+gap,0)+open/2;let shift=total<=vp.clientWidth?0:Math.max(vp.clientWidth-total,Math.min(0,vp.clientWidth/2-center));shelf.style.setProperty('--shift',shift+'px');}function select(i){current=Math.max(0,Math.min(books.length-1,i));books.forEach((el,j)=>{let on=j===current;el.classList.toggle('active',on);el.querySelector('button').tabIndex=on?-1:0;el.querySelector('.cover').tabIndex=on&&CATEGORIES[j].url?0:-1;el.querySelector('.cover').setAttribute('aria-hidden',String(!on));});prev.disabled=current===0;next.disabled=current===books.length-1;document.querySelector('.hint').textContent=CATEGORIES[current].name+' · '+String(current+1).padStart(2,'0')+' / '+String(books.length).padStart(2,'0');position()}prev.onclick=()=>select(current-1);next.onclick=()=>select(current+1);vp.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();select(current+(e.key==='ArrowRight'?1:-1))}});let x,y;vp.addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});vp.addEventListener('touchend',e=>{if(x==null)return;let dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy))select(current+(dx<0?1:-1));x=null},{passive:true});new ResizeObserver(position).observe(vp);select(current);
</script></body></html>
